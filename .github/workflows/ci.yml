name: CI

# Runs on every push and pull request: backend tests and lint, frontend type-check and build.
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/backend/requirements-dev.txt
      - name: Install ffmpeg (a few tests and voice notes need it)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements-dev.txt
      - name: Lint (unused code, undefined names)
        run: ruff check --select F app tests scripts
      - name: Tests
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: code/frontend/package-lock.json
      - run: npm ci
      - name: Type-check (no unused code)
        run: npx tsc --noEmit --noUnusedLocals
      - name: Build
        run: npm run build
        env:
          BACKEND_URL: http://localhost:8001
